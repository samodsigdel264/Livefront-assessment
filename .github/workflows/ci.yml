name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python: ["3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -r requirements.txt
      - run: pytest -q
      - name: End-to-end on generated data
        run: |
          python data_generator.py
          python -m pipeline.run
          python scripts/run_sample_queries.py > /dev/null
      - name: Data-quality gate trips on bad data (expects exit code 2)
        run: |
          python data_generator.py --dirty-rate 0.01 --output-dir data_dirty
          set +e
          python -m pipeline.run --source-dir data_dirty --db warehouse/breaker.duckdb --no-export --max-reject-rate 0.02
          test $? -eq 2
